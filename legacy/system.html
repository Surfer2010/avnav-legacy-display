<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>System</title>
  <link rel="stylesheet" href="css/display.css">
</head>
<body class="display-page" data-page="system">
  <main class="system-layout">
    <section class="tile" data-slot="one" data-path="transducers.TempAir" data-formatter="kelvin" data-decimals="1"><div class="label">AUSSENTEMP.</div><div class="value-row"><span class="value">--,-</span><span class="unit">°C</span></div></section>
    <section class="tile" data-slot="two" data-path="transducers.Barometer" data-formatter="pascalHpa" data-decimals="1"><div class="label">LUFTDRUCK</div><div class="value-row"><span class="value">--,-</span><span class="unit">hPa</span></div></section>
    <section class="tile" data-slot="three" data-path="signalk.environment.rpi.cpu.temperature" data-formatter="kelvin" data-decimals="1"><div class="label">CPU</div><div class="value-row"><span class="value">--,-</span><span class="unit">°C</span></div></section>
    <section class="tile" data-slot="four" data-path="signalk.environment.rpi.memory.utilisation" data-formatter="percent" data-decimals="0"><div class="label">RAM</div><div class="value-row"><span class="value">--</span><span class="unit">%</span></div></section>
    <section class="tile" data-slot="five" data-path="signalk.electrical.batteries.service.voltage" data-formatter="number" data-decimals="2"><div class="label">BATTERIE</div><div class="value-row"><span class="value">--,--</span><span class="unit">V</span></div></section>
    <section class="tile" data-slot="six" data-path="signalk.electrical.batteries.service.current" data-formatter="number" data-decimals="2"><div class="label">STROM</div><div class="value-row"><span class="value">--,--</span><span class="unit">A</span></div></section>
    <footer id="connection-state">VERBINDUNG WIRD HERGESTELLT</footer>
  </main>
  <script src="js/avnav-data.js"></script>
</body>
</html>
