<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Navigation</title>
  <link rel="stylesheet" href="css/display.css">
</head>
<body class="display-page" data-page="navigation">
  <main class="grid-layout">
    <section class="tile" data-slot="one" data-path="speed" data-formatter="number" data-decimals="1"><div class="label">GESCHWINDIGKEIT</div><div class="value-row"><span class="value">--,-</span><span class="unit">kn</span></div></section>
    <section class="tile" data-slot="two" data-path="track" data-formatter="course" data-decimals="0"><div class="label">KURS</div><div class="value-row"><span class="value">---</span><span class="unit">°</span></div></section>
    <section class="tile" data-slot="three" data-path="depth" data-formatter="number" data-decimals="1"><div class="label">TIEFE</div><div class="value-row"><span class="value">--,-</span><span class="unit">m</span></div></section>
    <section class="tile" data-slot="four" data-path="satUsed" data-formatter="number" data-decimals="0"><div class="label">SATELLITEN</div><div class="value-row"><span class="value">--</span><span class="unit"></span></div></section>
    <footer id="connection-state">VERBINDUNG WIRD HERGESTELLT</footer>
  </main>
  <script src="js/avnav-data.js"></script>
</body>
</html>
