<div id="dashboard" class="dashboard anchor-dashboard-static">
<table class="anchor-table" cellspacing="0" cellpadding="0">
<tr class="anchor-depth-row">
<td colspan="2">
<div class="tile hero" data-id="depth-main">
<div class="header">
<span class="label">DBK</span>
<span class="unit">m</span>
</div>
<div class="value"
 data-path="dbk"
 data-role="depth"
 data-formatter="depthAdaptive"
 data-decimals="1"
 data-max-chars="5"
 data-size="hero"
 data-value-scale="1">--,-</div>
</div>
</td>
</tr>

<tr class="anchor-lower-row">
<td>
<div class="tile large" data-id="speed-anchor">
<div class="header">
<span class="label">SOG</span>
<span class="unit">kn</span>
</div>
<div class="value"
 data-path="sog"
 data-role="speed"
 data-formatter="number"
 data-decimals="1"
 data-max-chars="5"
 data-size="large"
 data-value-scale="1">--,-</div>
</div>
</td>

<td>
<div class="tile large" data-id="wind-anchor">
<div class="header">
<span class="label">WIND</span>
<span class="unit">kn</span>
</div>
<div class="value"
 data-path="signalk.environment.wind.speedTrue"
 data-role="speed"
 data-formatter="speedMpsKn"
 data-decimals="1"
 data-max-chars="5"
 data-size="large"
 data-value-scale="1">--,-</div>
</div>
</td>
</tr>
</table>
